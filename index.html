<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="השירים שלי">
<title>השירים שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Heebo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0eef5;--sf:#fff;--ink:#1c1b3a;--mut:#6b6a85;--ac:#e8a33d;--ln:#d9d6e6;--night:#1c1b3a;--glow:#3b3478;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0d22;--sf:#181736;--ink:#efecfa;--mut:#9d9bbd;--ln:#2b2951;--night:#171540}}
:root[data-theme=dark]{--bg:#0e0d22;--sf:#181736;--ink:#efecfa;--mut:#9d9bbd;--ln:#2b2951;--night:#171540}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 1rem/1.7 Heebo,Arial,sans-serif;min-height:100%}
main{max-width:640px;margin:auto;padding:16px 18px 48px}
h1,h2,h3,.bb,.it b,.nm,summary{font-family:Bellefair,'Frank Ruhl Libre',Georgia,serif;font-weight:400}
h1.ttl{font-size:2.3rem;text-align:center;margin:6px 0 10px;line-height:1.15}
h2{font-size:2rem;margin:8px 0 12px;line-height:1.2}h3{font-size:1.45rem;margin:22px 0 6px}h4{margin:16px 0 4px;font-weight:600}
.mut{color:var(--mut)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button,.btn{font:inherit;font-weight:400;color:inherit;background:transparent;border:1px solid var(--ln);border-radius:999px;padding:9px 20px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:2px;align-items:center;padding:6px 10px;background:var(--bg)}
.tb a,.tb button{border:0;background:none;color:var(--ink);padding:9px;border-radius:50%;display:inline-flex}.sp{flex:1}
.hero{background:radial-gradient(110% 75% at 50% 0%,var(--glow),var(--night) 70%);color:#f3eefc;padding:14px 18px 30px;border-radius:0 0 44px 44px;text-align:center}
.hero>*{max-width:600px;margin-inline:auto}.hero .mut{color:#b9b5dc}.hero h2{font-size:2.1rem;margin:12px 0 2px}
.disc{width:min(74vw,300px);aspect-ratio:1;margin:12px auto 6px;position:relative;display:grid;place-items:center}
.gr{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 12%,rgba(255,255,255,.13) 18%,transparent 26% 62%,rgba(255,255,255,.1) 70%,transparent 78%),repeating-radial-gradient(circle,#0b0a20 0 2px,#1f1d4c 2px 4px);box-shadow:0 0 0 2px #4a4590,0 24px 50px -12px #0009}
.disc.on .gr{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.lab{position:relative;width:54%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--ac);color:#1c1b3a;display:grid;place-items:center;box-shadow:0 0 0 7px #0b0a20;font-size:.8rem;line-height:1.3;padding:10px}
.lab img,.lab video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-height:none;border-radius:0}
.stage{display:flex;align-items:center;justify-content:center;color:#b9b5dc;font-size:.9rem;margin:4px auto 6px}
.stage img,.stage video{max-width:100%;max-height:46vh;border-radius:22px;display:block}
.pg .stage{color:var(--mut)}
.nm{font-size:1.6rem;min-height:2.1rem;margin:6px 0}
.ctl{display:flex;justify-content:center;align-items:center;gap:18px;margin:12px 0 6px}
.ctl button{width:54px;height:54px;padding:0;border-radius:50%;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#f3eefc}
.ctl #pp{width:68px;height:68px;background:var(--ac);border-color:var(--ac);color:#1c1b3a}
input[type=range]{width:100%;accent-color:var(--ac)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.hero .duo button,.hero .duo .btn{border-color:rgba(255,255,255,.3);color:#f3eefc}
.bb{position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:flex-start;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-size:1.9rem;line-height:1.1;border-radius:28px 8px 28px 8px;text-decoration:none;min-height:104px;padding:16px 18px;--rg:var(--ln);cursor:pointer}
.bb::after{content:'';position:absolute;inset-inline-end:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 6px,var(--rg) 6px 7px);pointer-events:none}
.bb.pri{background:var(--ac);border-color:var(--ac);color:#1c1b3a;--rg:rgba(28,27,58,.3)}
.bb.nt{background:var(--night);border-color:var(--night);color:#f3eefc;--rg:rgba(255,255,255,.2)}
.quad{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:14px;height:calc(100dvh - 210px);min-height:340px;margin-top:18px}.quad .bb{font-size:2.2rem}
.stack{display:grid;gap:14px;margin-top:14px}.stack .bb{min-height:110px}
.ls{display:grid}
.it{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:14px 2px;border-bottom:1px solid var(--ln);color:var(--ink);text-decoration:none}
.it b{font-size:1.35rem}.it small{color:var(--mut)}
input[type=text],input[type=number],input[type=search]{width:100%;padding:10px 2px;border:0;border-bottom:1.5px solid var(--ln);border-radius:0;background:transparent;font:inherit;color:inherit}
textarea,select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:14px;background:var(--sf);font:inherit;color:inherit}
input[type=text]:focus,input[type=number]:focus,input[type=search]:focus{outline:0;border-bottom-color:var(--ac)}
textarea{min-height:150px;line-height:1.8}
label.f{display:block;margin:20px 0 4px;font-weight:600;font-size:.92rem}
.chip{position:relative;display:inline-flex;align-items:center;margin:4px 0 4px 8px;padding:6px 16px;border:1px solid var(--ln);border-radius:999px}.chip input{position:absolute;opacity:0}
.chip:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip:has(:focus-visible){outline:2px solid var(--ac)}
.cl{display:flex;gap:8px;align-items:center;margin:5px 0}.cl input{accent-color:var(--ac)}
.row{display:flex;gap:12px;align-items:center}.row>*{flex:1}
.ly{white-space:pre-wrap;font:300 1.15rem/2.1 Heebo,sans-serif;text-align:center;margin:22px 0}.ly.n{text-align:start;font-size:1rem;color:var(--mut)}
.dng{color:#c0392b}
.dr{position:fixed;inset-block:0;inset-inline-start:0;width:min(300px,85vw);background:var(--sf);border-inline-end:1px solid var(--ln);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;transform:translateX(100%);transition:transform .25s;z-index:9}.dr.open{transform:none}
.pg{padding:0 4px}.pg audio{width:100%;margin:10px 0}
.cover{border:1px solid var(--ink);outline:1px solid var(--ink);outline-offset:5px;padding:48px 14px;margin:14px 6px 28px;text-align:center}.cover h1{font-size:3rem;margin:0}
details{border-top:1px solid var(--ln);padding:4px 0}summary{cursor:pointer;font-size:1.5rem;padding:8px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="app"></div><audio id="a" preload="auto"></audio>
<script>
const $=(s,e=document)=>e.querySelector(s),app=$('#app'),A=$('#a');
const P=d=>`<svg viewBox="0 0 24 24">${d}</svg>`;
const I={home:P('<path d="M3 11l9-8 9 8M5 10v10h14V10"/>'),search:P('<circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/>'),star:P('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'),gear:P('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'),back:P('<path d="M5 12h14M13 6l6 6-6 6"/>'),play:P('<path d="M7 4l13 8-13 8z" fill="currentColor"/>'),pause:P('<path d="M7 4h4v16H7zM13 4h4v16h-4z" fill="currentColor"/>'),prev:P('<path d="M19 5v14"/><path d="M5 5l10 7-10 7z" fill="currentColor"/>'),next:P('<path d="M5 5v14"/><path d="M19 5l-10 7 10 7z" fill="currentColor"/>'),menu:P('<path d="M4 6h16M4 12h16M4 18h16"/>')};
let D={songs:[],cats:[],types:[],hist:[],set:{recent:'week',auto:'next'}},Q=[],LQ=[],cur=null;const urls={};
const IDB=new Promise((ok,no)=>{const r=indexedDB.open('mysongs',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kv=async(m,k,v)=>{const db=await IDB;return new Promise((ok,no)=>{const s=db.transaction('kv',m==='get'?'readonly':'readwrite').objectStore('kv');const q=m==='get'?s.get(k):m==='set'?s.put(v,k):s.delete(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
const save=()=>kv('set','data',D),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byName=(a,b)=>a.title.localeCompare(b.title,'he');
const kids=p=>D.cats.filter(c=>(c.p||null)===(p||null)).sort((a,b)=>a.name.localeCompare(b.name,'he'));
const sub=id=>[id,...kids(id).flatMap(c=>sub(c.id))];
const walk=(p=null,d=0)=>kids(p).flatMap(c=>[[c,d],...walk(c.id,d+1)]);
const scoped=sc=>D.songs.filter(s=>sc==='all'||s.kind===sc);
const LAB={song:'שירים',tune:'לחנים',all:'הכול'};
const dt=s=>[s.day,s.month,s.year].filter(Boolean).join('/')+(s.hy?` (${s.hy})`:'');
const nmOf=(arr,ids)=>ids.map(i=>arr.find(x=>x.id==i)?.name).filter(Boolean).join('، ');
const li=(s,h='song')=>`<a class="it" href="#/${h}/${s.id}"><b>${esc(s.title)}</b><small>${s.kind==='song'?'שיר':'לחן'}${dt(s)?' - '+dt(s):''}</small></a>`;
const empty='<p class="mut">אין יצירות להצגה.</p>';
async function U(id,k){const key=id+k;if(urls[key])return urls[key];try{return urls[key]=URL.createObjectURL(await kv('get',`m:${id}:${k}`))}catch(e){return''}}
const nav=()=>`<header class="tb"><button onclick="history.back()" aria-label="חזרה">${I.back}</button><span class="sp"></span><a href="#/" aria-label="בית">${I.home}</a><a href="#/scope/fav" aria-label="מועדפים">${I.star}</a><a href="#/songs" aria-label="חיפוש">${I.search}</a><a href="#/settings" aria-label="הגדרות">${I.gear}</a></header>`;
function show(h,book,pre){app.innerHTML=(book?'':nav())+(pre||'')+`<main>${h}</main>`;scrollTo(0,0)}
const ctl=()=>`<div class="ctl"><button id="pv" aria-label="הקודם">${I.prev}</button><button id="pp" aria-label="הפעלה או השהיה">${I.play}</button><button id="nx" aria-label="הבא">${I.next}</button></div><input id="sk" type="range" min="0" max="100" value="0" aria-label="התקדמות">`;
function bindCtl(p,n){$('#pv').onclick=p;$('#nx').onclick=n;$('#pp').onclick=()=>A.paused?A.play():A.pause();$('#pp').innerHTML=A.paused?I.play:I.pause;$('#sk').oninput=e=>{if(A.duration)A.currentTime=A.duration*e.target.value/100}}
A.addEventListener('play',()=>{const dc=$('.disc');if(dc)dc.classList.add('on');const b=$('#pp');if(b)b.innerHTML=I.pause;const v=$('#vd');if(v&&v.dataset.h){v.hidden=false;const im=$('#stage img');if(im)im.hidden=true;v.play()}});
A.addEventListener('pause',()=>{const dc=$('.disc');if(dc)dc.classList.remove('on');const b=$('#pp');if(b)b.innerHTML=I.play;const v=$('#vd');if(v)v.pause()});
A.addEventListener('timeupdate',()=>{const k=$('#sk');if(k&&A.duration)k.value=A.currentTime/A.duration*100});
A.addEventListener('error',()=>{if(A.getAttribute('src'))alert('קובץ השמע אינו תקין או אינו מתנגן. ניתן להחליף אותו במסך העריכה של היצירה.')});
A.addEventListener('ended',()=>{if(D.set.auto==='repeat'){A.play();return}const h=location.hash;if(h.startsWith('#/song/'))location.hash='#/song/'+nb(cur,1);else if(h===''||h==='#/')hn()});
async function stage(el,id,book){if(!el)return;if(!id){el.innerHTML='<p class="mut">לחצו על ״הבא״ כדי להתחיל לנגן</p>';return}const s=D.songs.find(x=>x.id==id);let h='';
 if(s.has.image)h+=`<img src="${await U(id,'image')}" alt="">`;
 if(s.has.video)h+=`<video id="vd" src="${await U(id,'video')}" muted playsinline ${book?'controls':''} ${s.has.image&&!book?'hidden data-h="1"':book?'':'data-h="1"'}></video>`;
 el.innerHTML=h||'<p class="mut">ליצירה אין תמונה או סרטון</p>'}
async function play(id,push=true){cur=id;A.src=await U(id,'audio');try{await A.play()}catch(e){}if(push){D.hist.push(id);D.hist=D.hist.slice(-200);save()}}
async function hn(){let l=D.songs.filter(s=>s.has.audio);if(l.length>1)l=l.filter(s=>s.id!==cur);if(!l.length)return alert('אין עדיין יצירות להשמעה. הוסיפו שיר חדש.');const s=l[Math.random()*l.length|0];await play(s.id);if($('#nm')){stage($('#stage'),s.id);$('#nm').textContent=s.title}}
async function hp(){if(D.hist.length<2)return;D.hist.pop();const id=D.hist[D.hist.length-1];await play(id,false);save();if($('#nm')){stage($('#stage'),id);$('#nm').textContent=D.songs.find(s=>s.id===id)?.title||''}}
const nb=(id,d)=>{const q=Q.includes(id)?Q:D.songs.slice().sort(byName).map(s=>s.id);const i=q.indexOf(id);return q[(i+d+q.length)%q.length]};
const V={};
V.home=()=>{const s=D.songs.find(x=>x.id===cur);show(`<div class="duo"><a class="bb nt" href="#/songs">השירים שלי</a><a class="bb" href="#/book">ספר השירים</a></div>`,0,`<section class="hero"><h1 class="ttl">אפליקציית<br>השירים שלי</h1><div class="disc${A.paused?'':' on'}"><div class="gr"></div><div id="stage" class="lab"></div></div><p id="nm" class="nm">${esc(s?.title||'')}</p>${ctl()}</section>`);stage($('#stage'),cur);bindCtl(hp,hn)};
V.songs=()=>{show(`<h2>השירים שלי</h2><input id="q" type="search" placeholder="חיפוש בשם היצירה" aria-label="חיפוש"><label class="chip"><input id="dp" type="checkbox">חיפוש עמוק (גם בתוך המילים)</label><div id="rs" class="ls"></div><div class="quad"><a class="bb nt" href="#/scope/keys">מפתחות</a><a class="bb" href="#/scope/fav">מועדפים</a><a class="bb" href="#/scope/recent">אחרונים</a><a class="bb pri" href="#/new">שיר חדש</a></div>`);
 const run=()=>{const w=$('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean),dp=$('#dp').checked;if(!w.length){$('#rs').innerHTML='';return}const r=D.songs.filter(s=>{const t=(s.title+(dp?' '+s.lyrics:'')).toLowerCase();return w.every(x=>t.includes(x))}).sort(byName);LQ=r.map(s=>s.id);$('#rs').innerHTML=r.map(s=>li(s)).join('')||empty};$('#q').oninput=run;$('#dp').onchange=run};
V.scope=n=>show(`<h2>בחירה</h2><div class="stack">${['tune','song','all'].map(k=>`<a class="bb" href="#/${n==='keys'?'keys':n}/${k}">${LAB[k]}</a>`).join('')}</div>`);
V.keys=sc=>show(`<h2>מפתחות: ${LAB[sc]}</h2><div class="stack">${[['alpha','א״ב'],['cat','קטגוריה'],['type','סוג'],['date','תאריך'],['all','הכול']].map(([k,t])=>`<a class="bb" href="#/k/${sc}/${k}">${t}</a>`).join('')}</div>`);
function list(t,arr,x=''){LQ=arr.map(s=>s.id);show(`<h2>${t}</h2>${x}<div class="ls">${arr.map(s=>li(s)).join('')||empty}</div>`)}
V.k=(sc,key,id)=>{const L=scoped(sc),lab=LAB[sc];
 if(key==='alpha')return list(`${lab}: לפי א״ב`,L.sort(byName));
 if(key==='all')return list(`${lab}: אקראי`,L.sort(()=>Math.random()-.5));
 if(key==='date'){const dir=id==='old'?1:-1,dk=s=>s.year||(s.hy?s.hy-3760:0),dd=s=>s.month||s.day?1:0;L.sort((a,b)=>(dk(a)-dk(b))*dir||dd(a)-dd(b)||(dd(a)?(a.month*32+a.day)-(b.month*32+b.day):byName(a,b)));return list(`${lab}: לפי תאריך יצירה`,L,`<div class="duo"><a class="btn" href="#/k/${sc}/date/new">חדש לישן</a><a class="btn" href="#/k/${sc}/date/old">ישן לחדש</a></div>`)}
 const isC=key==='cat',src=isC?D.cats:D.types;
 if(!id)return show(`<h2>${lab}: ${isC?'קטגוריות':'סוגים'}</h2><div class="ls">${(isC?walk():D.types.map(t=>[t,0])).map(([c,d])=>`<a class="it" style="margin-inline-start:${d*18}px" href="#/k/${sc}/${key}/${c.id}"><b>${esc(c.name)}</b><small>${L.filter(s=>(isC?s.cats:s.types).some(x=>(isC?sub(c.id):[c.id]).includes(x))).length}</small></a>`).join('')||'<p class="mut">עדיין אין פריטים. ניתן להוסיף בהגדרות.</p>'}</div>`);
 const ids=isC?sub(id):[id];list(`${lab}: ${esc(src.find(x=>x.id==id)?.name||'')}`,L.filter(s=>(isC?s.cats:s.types).some(x=>ids.includes(x))).sort(byName))};
V.fav=sc=>list(`מועדפים: ${LAB[sc]}`,scoped(sc).filter(s=>s.fav).sort(byName));
V.recent=sc=>{const w={day:864e5,week:6048e5,month:2592e6}[D.set.recent];list(`אחרונים: ${LAB[sc]}`,scoped(sc).filter(s=>s.added>Date.now()-w).sort((a,b)=>b.added-a.added),`<p class="mut">מוצגות יצירות שנוספו ב${{day:'יום',week:'שבוע',month:'חודש'}[D.set.recent]} האחרון. <a href="#/settings">שינוי בהגדרות</a></p>`)};
V.new=()=>show(`<h2>יצירה חדשה</h2><div class="stack"><a class="bb" href="#/form/song">שיר</a><a class="bb" href="#/form/tune">לחן</a></div>`);
V.form=k=>form(k);V.edit=id=>form(null,id);
function fill(tc,cc){const ck=n=>[...app.querySelectorAll(`[name=${n}]:checked`)].map(x=>x.value);tc=tc||ck('t');cc=cc||ck('c');
 $('#tb').innerHTML=D.types.map(t=>`<label class="chip"><input type="checkbox" name="t" value="${t.id}" ${tc.includes(t.id)?'checked':''}>${esc(t.name)}</label>`).join('');
 $('#cb').innerHTML=walk().map(([c,d])=>`<label class="cl" style="margin-inline-start:${d*18}px"><input type="checkbox" name="c" value="${c.id}" ${cc.includes(c.id)?'checked':''}>${esc(c.name)}</label>`).join('')||'<p class="mut">אין קטגוריות עדיין. הוסיפו קטגוריה ראשונה.</p>'}
function form(kind,id){const s=id?D.songs.find(x=>x.id==id):{kind,types:[],cats:[],lyrics:'',note:'',has:{}};kind=s.kind;
 show(`<h2>${id?'עריכת יצירה':kind==='song'?'שיר חדש':'לחן חדש'}</h2>
 <label class="f" for="ti">שם</label><input id="ti" type="text" value="${esc(s.title||'')}" placeholder="אם ריק, ייקבע לפי שם קובץ השמע">
 <label class="f" for="fa">קובץ שמע (חובה)${s.has.audio?' - קיים, בחירה תחליף אותו':''}</label><input id="fa" type="file" accept="audio/*">
 <label class="f" for="fi">תמונה${s.has.image?' - קיימת, בחירה תחליף אותה':''}</label><input id="fi" type="file" accept="image/*">
 <label class="f" for="fv">סרטון${s.has.video?' - קיים, בחירה יחליף אותו':''}</label><input id="fv" type="file" accept="video/*">

async function saveSong(id,kind){const f=k=>$('#'+k).value.trim(),s0=id?D.songs.find(x=>x.id==id):null,au=$('#fa').files[0],im=$('#fi').files[0],vi=$('#fv').files[0],ck=n=>[...app.querySelectorAll(`[name=${n}]:checked`)].map(x=>x.value),t=ck('t'),c=ck('c'),m=[];
 if(!au&&!s0?.has.audio)m.push('קובץ שמע');if(!t.length)m.push('סוג');if(!c.length)m.push('קטגוריה');if(!f('y')&&!f('hy'))m.push('שנה (לועזית או עברית)');
 if(m.length)return alert('לא ניתן לשמור. חסר: '+m.join(', '));
 const ly=$('#ly').value;if(s0?.has.audio&&!au&&s0.lyrics!==ly&&!confirm('המילים שונו אך קובץ השמע לא הוחלף. לשמור בכל זאת?'))return;
 const s=s0||{id:uid(),kind,added:Date.now(),fav:false,has:{}};
 Object.assign(s,{title:f('ti')||(au?au.name.replace(/\.[^.]+$/,''):s.title)||'ללא שם',lyrics:ly,note:$('#nt').value,year:+f('y')||0,hy:+f('hy')||0,month:+f('mo')||0,day:+f('dy')||0,types:t,cats:c});
 try{for(const[k,fl]of[['audio',au],['image',im],['video',vi]])if(fl){await kv('set',`m:${s.id}:${k}`,fl);s.has[k]=1;delete urls[s.id+k]}}catch(e){return alert('שמירת הקובץ נכשלה. ייתכן שאין מספיק מקום באחסון הדפדפן.')}
 if(!s0)D.songs.push(s);if(au&&cur===s.id)cur=null;await save();location.hash='#/song/'+s.id}
async function delSong(id){if(!confirm('המחיקה היא לצמיתות ותכלול את המילים, השמע, התמונה, הסרטון, ההערות וכל נתון משויך. למחוק?'))return;for(const k of['audio','image','video']){await kv('del',`m:${id}:${k}`);delete urls[id+k]}D.songs=D.songs.filter(s=>s.id!==id);D.hist=D.hist.filter(x=>x!==id);if(cur===id){A.pause();A.removeAttribute('src');cur=null}await save();location.hash='#/songs'}

 show(`<pre class="ly">${esc(s.lyrics)}</pre>${s.note?`<h3>הערה / מבנה</h3><pre class="ly n">${esc(s.note)}</pre>`:''}`,0,`<section class="hero"><div id="stage" class="stage"></div><h2>${esc(s.title)}</h2><p class="mut">${s.kind==='song'?'שיר':'לחן'}${dt(s)?' - '+dt(s):''}<br>${esc(nmOf(D.types,s.types))}<br>${esc(nmOf(D.cats,s.cats))}</p>${ctl()}<div class="duo"><button id="fb">${s.fav?'הסרה ממועדפים':'הוספה למועדפים'}</button><a class="btn" href="#/edit/${id}">עריכה</a></div></section>`);
 bindCtl(()=>location.hash='#/song/'+nb(id,-1),()=>location.hash='#/song/'+nb(id,1));$('#fb').onclick=async()=>{s.fav=!s.fav;await save();V.song(id)};
 if(cur!==id)await play(id);stage($('#stage'),id)};

 show(`<h2>הגדרות</h2><label class="f" for="sr">יצירה נחשבת ״אחרונה״</label><select id="sr">${[['day','יום'],['week','שבוע'],['month','חודש']].map(([v,t])=>`<option value="${v}" ${D.set.recent===v?'selected':''}>${t}</option>`).join('')}</select>
 <label class="f" for="sa">בסיום יצירה</label><select id="sa"><option value="next" ${D.set.auto==='next'?'selected':''}>מעבר ליצירה הבאה</option><option value="repeat" ${D.set.auto==='repeat'?'selected':''}>חזרה על היצירה</option></select>

app.onclick=async e=>{if(e.target.closest('.it[href^="#/song"]'))Q=LQ;const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i;
 if(a==='f'){const n=prompt('שם חדש');if(n&&n.trim()){(i==='c'?D.cats:D.types).push({id:uid(),name:n.trim(),p:null});await save();fill()}return}

  if(bl.length)return alert(`לא ניתן למחוק: היצירות הבאות יישארו ללא ${nm}. יש לשייך להן ${nm} נוספת במסך העריכה:\n`+bl.map(s=>s.title).join('\n'));
  if(!confirm('למחוק?'))return;D[fld]=arr.filter(x=>!ids.includes(x.id));D.songs.forEach(s=>s[fld]=s[fld].filter(x=>!ids.includes(x)))}
 await save();V.settings()};

 return `<details><summary>מפתח ${LAB[sc]}</summary><h4>לפי א״ב</h4>${L.map(lk).join('')}<h4>לפי קטגוריה</h4>${walk().map(([c,d])=>`<div style="margin-inline-start:${d*14}px"><b>${esc(c.name)}</b>${L.filter(s=>s.cats.includes(c.id)).map(lk).join('')}</div>`).join('')}<h4>לפי סוג</h4>${D.types.map(t=>`<div><b>${esc(t.name)}</b>${L.filter(s=>s.types.includes(t.id)).map(lk).join('')}</div>`).join('')}<h4>לפי תאריך</h4>${L.slice().sort((a,b)=>dk(a)-dk(b)).map(s=>`<div><a href="#/bk/${s.id}">${esc(s.title)}</a> <span class="mut">${dt(s)}</span></div>`).join('')}</details>`};

V.bk=async id=>{const s=D.songs.find(x=>x.id==id);if(!s)return V.book();A.pause();
 show(`${bar('#/book')}<article class="pg"><h1 class="ttl">${esc(s.title)}</h1><p class="mut">${s.kind==='song'?'שיר':'לחן'}${dt(s)?' - '+dt(s):''}<br>${esc(nmOf(D.types,s.types))}<br>${esc(nmOf(D.cats,s.cats))}</p><div id="stage" class="stage" ${s.has.image||s.has.video?'':'hidden'}></div>${s.has.audio?'<audio id="ba" controls></audio>':''}<pre class="ly">${esc(s.lyrics)}</pre>${s.note?`<h3>הערה / מבנה</h3><pre class="ly">${esc(s.note)}</pre>`:''}</article>`,1);bm();
 stage($('#stage'),id,1);if(s.has.audio)$('#ba').src=await U(id,'audio')};
